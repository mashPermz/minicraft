<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>minicraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1220;
        }
        #glcanvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9ab;
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">loading minicraft.wasm ...</div>
    <canvas id="glcanvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>
        // localStorage セーブ用プラグイン(Rust側 storage.rs の extern "C" に対応)
        var LS_KEY = "minicraft_save";
        miniquad_add_plugin({
            version: 1,
            name: "minicraft_storage",
            register_plugin: function (importObject) {
                importObject.env.ls_save = function (ptr, len) {
                    var bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                    try {
                        localStorage.setItem(LS_KEY, new TextDecoder().decode(bytes));
                    } catch (e) {
                        console.warn("save failed:", e);
                    }
                };
                importObject.env.ls_size = function () {
                    var s = localStorage.getItem(LS_KEY);
                    return s ? new TextEncoder().encode(s).length : 0;
                };
                importObject.env.ls_load = function (ptr, maxlen) {
                    var s = localStorage.getItem(LS_KEY);
                    if (!s) return 0;
                    var bytes = new TextEncoder().encode(s);
                    var n = Math.min(bytes.length, maxlen);
                    new Uint8Array(wasm_memory.buffer, ptr, n).set(bytes.subarray(0, n));
                    return n;
                };
                importObject.env.ls_clear = function () {
                    localStorage.removeItem(LS_KEY);
                };
            }
        });
        load("minicraft.wasm");
        // 読み込みが終わったら表示を消す(描画開始まで少し待つ)
        const t = setInterval(() => {
            if (typeof wasm_exports !== "undefined" && wasm_exports) {
                document.getElementById("loading").remove();
                clearInterval(t);
            }
        }, 200);
    </script>
</body>
</html>
