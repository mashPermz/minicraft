<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>minicraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1220;
        }
        #glcanvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9ab;
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">loading minicraft.wasm ...</div>
    <canvas id="glcanvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>
        load("minicraft.wasm");
        // 読み込みが終わったら表示を消す(描画開始まで少し待つ)
        const t = setInterval(() => {
            if (typeof wasm_exports !== "undefined" && wasm_exports) {
                document.getElementById("loading").remove();
                clearInterval(t);
            }
        }, 200);
    </script>
</body>
</html>
